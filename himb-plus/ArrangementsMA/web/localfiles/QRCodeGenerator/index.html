var qrBase64;
function makeCode (sText, codeWidth, codeHeight, correctionLvl = 0, darkColor = "#000000", lightColor = "#FFFFFF") {
	//console.log("Generating started");	
	var oQRCode = new QRCode("qrcode", {
		text : sText,
		width : codeWidth,
		height : codeHeight,
		colorDark: darkColor,
		colorLight: lightColor,
		correctLevel: correctionLvl
	});
	var tempQrBase64 = oQRCode._oDrawing._elCanvas.toDataURL("image/png");
	createShareQR(tempQrBase64);
}

var documentReady = false;
$(document).ready(function(){
	documentReady = true;
});

function isDocumentReady(){
	return documentReady;
}

function getQRImgSrc(){
	try{

		console.log("*************************Inside if getQRImgSrc************"+ qrBase64);
		console.log("*************************"+localStorage.getItem("qrbase"));
		return qrBase64;
	} else {
		return "";
	}
	}catch(e){
		console.log("*************************"+ e);
	}
}

function makeDefaultQRCode(params){
	document.getElementById("qrcode").innerHTML = "";
	makeCode(params, 205, 205, 0);
}

function makeDefaultQRCodeiOS(params){
	document.getElementById("qrcode").innerHTML = "";
	makeCode(params, 850, 850, 0);
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    //img.crossOrigin = "anonymous"; // needed for external URLs with CORS enabled
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`Failed to load image: ${src}`));
    img.src = src;
  });
}
